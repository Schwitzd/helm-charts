# @section -- Image settings
image:
  # -- Container image repository.
  repository: schwitzd/ark-scraper
  # -- Container image tag.
  tag: 0.6.0
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Override chart name for resources.
nameOverride: ""
# -- Override full release name for resources.
fullnameOverride: ""

# @section -- CronJob settings
cronjob:
  # -- Cron schedule for the scraper job.
  schedule: "0 2 * * *"
  # -- Concurrency policy for the CronJob.
  concurrencyPolicy: Forbid
  # -- Successful job history limit.
  successfulJobsHistoryLimit: 3
  # -- Failed job history limit.
  failedJobsHistoryLimit: 1

# @section -- Ark scraper settings
ark:
  # -- URL for the trade file to scrape.
  tradeFileUrl: ""

# @section -- PostgreSQL settings
postgres:
  # -- PostgreSQL host.
  host: ""
  # -- PostgreSQL port.
  port: 5432
  # -- PostgreSQL database name.
  database: ""
  auth:
    # -- Existing secret containing PostgreSQL credentials.
    existingSecret: ""
    # -- PostgreSQL username (chart creates a Secret when set and existingSecret is empty).
    username: ""
    # -- PostgreSQL password (chart creates a Secret when set and existingSecret is empty).
    password: ""
    # -- Secret key for the PostgreSQL username.
    usernameKey: username
    # -- Secret key for the PostgreSQL password.
    passwordKey: password

# @section -- Mailer settings
mailer:
  # -- Enable mailer integration.
  enabled: true
  # -- Mailer API base URL.
  apiUrl: ""
  # -- Whether to include traceback details in notifications.
  includeTraceback: "false"
  # -- Comma-separated list of recipient email addresses.
  toEmails: ""
  api:
    # -- Existing secret containing the mailer API key.
    existingSecret: ""
    # -- Mailer API key (chart creates a Secret when set and existingSecret is empty).
    apiKey: ""
    # -- Secret key for the mailer API key.
    apiKeyKey: api_key

# @section -- Pod configuration
# -- Additional environment variables for the pod.
extraEnv: []

# -- Annotations to add to the pod.
podAnnotations: {}
# -- Labels to add to the pod.
podLabels: {}

# -- Service account name for the pod.
serviceAccountName: ""

# -- Pod-level security context applied to all containers.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

# -- Container-level security context.
securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# -- Resource requests and limits for the container.
resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 256Mi
  # limits:
  #   cpu: 500m
  #   memory: 512Mi

# -- Node selector for pod scheduling.
nodeSelector: {}

# -- Tolerations for pod scheduling.
tolerations: []

# -- Affinity rules for pod scheduling.
affinity: {}
