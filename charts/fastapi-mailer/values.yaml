# -- Override chart name for resources.
nameOverride: ""
# -- Override full release name for resources.
fullnameOverride: ""

image:
  # -- Container image repository.
  repository: harbor.schwitzd.me/library/fastapi-mailer
  # -- Container image tag.
  tag: "1.0.0"
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries.
imagePullSecrets: []

# -- Annotations to add to the Deployment.
deploymentAnnotations:
  argocd.argoproj.io/sync-wave: "10"

# -- Number of pod replicas.
replicaCount: 1
# -- Number of old ReplicaSets to retain.
revisionHistoryLimit: 4

resources:
  requests:
    # -- CPU request.
    cpu: 50m
    # -- Memory request.
    memory: 64Mi
  limits:
    # -- CPU limit.
    cpu: 100m
    # -- Memory limit.
    memory: 128Mi

# -- Pod-level security context applied to all containers.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# -- Container-level security context.
securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# -- Liveness probe configuration.
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

# -- Readiness probe configuration.
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

ingress:
  # -- Enable Ingress resource.
  enabled: false
  # -- Ingress class name.
  className: ""
  # -- Ingress annotations.
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- Ingress hostname.
  host: chart-example.local
  # -- TLS configuration. Each entry has a secretName and a list of hosts.
  tls: []

httpRoute:
  # -- Enable HTTPRoute resource (Gateway API).
  enabled: false
  # -- Name of the Gateway the route attaches to.
  gatewayName: "external-gateway"
  # -- Namespace where the Gateway resides.
  gatewayNamespace: "gateway-system"
  # -- List of hostnames for this route.
  hostnames:
    - chart-example.local

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port.
  port: 80
  # -- Container target port.
  targetPort: 80

# -- Name of the existing Secret containing SMTP credentials.
secretName: secret-fastapi-mailer
