apiVersion: v1
kind: Service
metadata:
  name: {{ include "ark-live.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ark-live.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "ark-live.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
  type: {{ .Values.service.type }}
