# @section -- Image settings
image:
  # -- Container image repository.
  repository: schwitzd/ark-live
  # -- Container image tag.
  tag: "1.0.3"
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries.
imagePullSecrets: []

# -- Override chart name for resources.
nameOverride: ""
# -- Override full release name for resources.
fullnameOverride: ""

# -- Annotations to add to the Deployment.
deploymentAnnotations: {}

# -- Number of old ReplicaSets to retain.
revisionHistoryLimit: 4

# @section -- RabbitMQ settings
rabbitmq:
  # -- AMQP connection URL (without credentials when using existingSecret). Required.
  url: ""
  # -- RabbitMQ virtual host.
  vhost: ""
  # -- Stream queue name to tail. Required - intentionally has no default, since it
  # names a specific piece of RabbitMQ infrastructure that can change independently
  # of this chart.
  queue: ""
  # -- Whether the app only passively declares the queue; it never creates one.
  queuePassive: true
  # -- Consumer prefetch count.
  prefetch: 100
  # -- Stream offset to replay from on every (re)connect.
  streamOffset: "first"
  # -- Seconds to wait between reconnect attempts after a connection failure.
  reconnectDelay: 5
  auth:
    # -- Existing secret containing RabbitMQ credentials.
    existingSecret: ""
    # -- RabbitMQ username (chart creates a Secret when set and existingSecret is empty).
    username: ""
    # -- RabbitMQ password (chart creates a Secret when set and existingSecret is empty).
    password: ""
    # -- Secret key for the RabbitMQ username.
    usernameKey: username
    # -- Secret key for the RabbitMQ password.
    passwordKey: password

# @section -- Pod configuration
resources:
  requests:
    # -- CPU request.
    cpu: 50m
    # -- Memory request.
    memory: 64Mi
  limits:
    # -- CPU limit.
    cpu: 150m
    # -- Memory limit.
    memory: 128Mi

# -- Pod-level security context applied to all containers.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context.
securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# -- Liveness probe configuration. Hits /api/trades (a cheap in-memory read) rather
# than a dedicated health endpoint, so a transient RabbitMQ outage doesn't cause
# Kubernetes to kill/restart the pod.
livenessProbe:
  httpGet:
    path: /api/trades
    port: http
  initialDelaySeconds: 5
  periodSeconds: 30

# -- Readiness probe configuration.
readinessProbe:
  httpGet:
    path: /api/trades
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15

# -- Additional environment variables for the pod.
extraEnv: []

# -- Annotations to add to the pod.
podAnnotations: {}
# -- Labels to add to the pod.
podLabels: {}

# -- Service account name for the pod.
serviceAccountName: ""

ingress:
  # -- Enable Ingress resource.
  enabled: false
  # -- Ingress class name.
  className: ""
  # -- Ingress annotations.
  annotations: {}
  # -- Ingress hostname.
  host: chart-example.local
  # -- TLS configuration. Each entry has a secretName and a list of hosts.
  tls: []

httpRoute:
  # -- Enable HTTPRoute resource (Gateway API).
  enabled: false
  # -- Name of the Gateway the route attaches to.
  gatewayName: "external-gateway"
  # -- Namespace where the Gateway resides.
  gatewayNamespace: "gateway-system"
  # -- List of hostnames for this route.
  hostnames:
    - chart-example.local

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port.
  port: 80
  # -- Container target port.
  targetPort: 80

# -- Node selector for pod scheduling.
nodeSelector: {}
# -- Tolerations for pod scheduling.
tolerations: []
# -- Affinity rules for pod scheduling.
affinity: {}
