{{- include "ark-website-backend.validateApiKey" . -}}
{{- $apiNeedsSecret := and (not .Values.api.auth.existingSecret) .Values.api.auth.apiKey -}}
{{- if $apiNeedsSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ark-website-backend.apiSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ark-website-backend.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.api.auth.apiKeyKey }}: {{ .Values.api.auth.apiKey | b64enc }}
{{- end }}
