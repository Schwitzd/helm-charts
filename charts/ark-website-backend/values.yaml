# @section -- Image settings
image:
  # -- Container image repository.
  repository: schwitzd/ark-website-backend
  # -- Container image tag.
  tag: "1.0.6"
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries.
imagePullSecrets: []

# -- Override chart name for resources.
nameOverride: ""
# -- Override full release name for resources.
fullnameOverride: ""

# -- Annotations to add to the Deployment.
deploymentAnnotations: {}

# -- Number of pod replicas. The app is stateless, so it can be scaled freely.
replicaCount: 1
# -- Number of old ReplicaSets to retain.
revisionHistoryLimit: 4

# @section -- Application settings
app:
  # -- Application environment (APP_ENV). "development" enables CORS for http://localhost:3000.
  env: "production"
  # -- Number of gunicorn workers (WEB_CONCURRENCY). Set explicitly because gunicorn
  # otherwise sizes workers from the node's CPU count, ignoring the pod's CPU limit.
  # Each worker opens up to 5 PostgreSQL connections.
  webConcurrency: 2

# @section -- API settings
api:
  auth:
    # -- Existing secret containing the API key clients must send in the X-API-KEY header.
    existingSecret: ""
    # -- API key (chart creates a Secret when set and existingSecret is empty).
    # One of existingSecret or apiKey is required.
    apiKey: ""
    # -- Secret key for the API key.
    apiKeyKey: api_key

# @section -- PostgreSQL settings
postgres:
  # -- PostgreSQL host. Required.
  host: ""
  # -- PostgreSQL port.
  port: 5432
  # -- PostgreSQL database name. Required.
  database: ""
  auth:
    # -- Existing secret containing PostgreSQL credentials.
    existingSecret: ""
    # -- PostgreSQL username (chart creates a Secret when set and existingSecret is empty).
    username: ""
    # -- PostgreSQL password (chart creates a Secret when set and existingSecret is empty).
    password: ""
    # -- Secret key for the PostgreSQL username.
    usernameKey: username
    # -- Secret key for the PostgreSQL password.
    passwordKey: password

# @section -- Pod configuration
resources:
  requests:
    # -- CPU request.
    cpu: 50m
    # -- Memory request.
    memory: 128Mi
  limits:
    # -- CPU limit.
    cpu: 250m
    # -- Memory limit.
    memory: 256Mi

# -- Pod-level security context applied to all containers.
# runAsUser/runAsGroup match the image's arkuser (uid/gid 10001).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context.
securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# -- Liveness probe configuration. Hits / (does not touch the database), so a
# transient PostgreSQL outage doesn't cause Kubernetes to restart the pod.
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 30

# -- Readiness probe configuration.
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15

# -- Additional environment variables for the pod.
extraEnv: []

# -- Annotations to add to the pod.
podAnnotations: {}
# -- Labels to add to the pod.
podLabels: {}

# -- Service account name for the pod.
serviceAccountName: ""

ingress:
  # -- Enable Ingress resource.
  enabled: false
  # -- Ingress class name.
  className: ""
  # -- Ingress annotations.
  annotations: {}
  # -- Ingress hostname.
  host: chart-example.local
  # -- TLS configuration. Each entry has a secretName and a list of hosts.
  tls: []

httpRoute:
  # -- Enable HTTPRoute resource (Gateway API).
  enabled: false
  # -- Name of the Gateway the route attaches to.
  gatewayName: "external-gateway"
  # -- Namespace where the Gateway resides.
  gatewayNamespace: "gateway-system"
  # -- List of hostnames for this route.
  hostnames:
    - chart-example.local

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port.
  port: 80
  # -- Container target port (passed to the app as PORT).
  targetPort: 5000

# -- Node selector for pod scheduling.
nodeSelector: {}
# -- Tolerations for pod scheduling.
tolerations: []
# -- Affinity rules for pod scheduling.
affinity: {}
