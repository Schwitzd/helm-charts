{{- include "ark-website-frontend.validateBackend" . -}}
{{- $apiNeedsSecret := and (not .Values.backend.auth.existingSecret) .Values.backend.auth.apiKey -}}
{{- if $apiNeedsSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ark-website-frontend.apiSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ark-website-frontend.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.backend.auth.apiKeyKey }}: {{ .Values.backend.auth.apiKey | b64enc }}
{{- end }}
