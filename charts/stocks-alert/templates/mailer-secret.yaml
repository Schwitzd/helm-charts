{{- if and (not .Values.mailer.auth.existingSecret) .Values.mailer.auth.apiKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stocks-alert.mailerSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stocks-alert.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.mailer.auth.apiKeyKey }}: {{ .Values.mailer.auth.apiKey | b64enc }}
{{- end }}
