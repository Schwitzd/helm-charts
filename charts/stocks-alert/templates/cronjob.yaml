apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "stocks-alert.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stocks-alert.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: {{ .Values.cronjob.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "stocks-alert.labels" . | nindent 12 }}
            {{- with .Values.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          restartPolicy: Never
          {{- if .Values.serviceAccountName }}
          serviceAccountName: {{ .Values.serviceAccountName }}
          {{- end }}
          {{- with .Values.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: {{ include "stocks-alert.name" . }}
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              {{- with .Values.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              env:
                - name: COSMOS_DB_DATABASE_NAME
                  value: {{ .Values.cosmos.databaseName | quote }}
                - name: COSMOS_DB_CONTAINER_NAME
                  value: {{ .Values.cosmos.containerName | quote }}
                - name: COSMOS_DB_CONNECTION_STRING
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.cosmos.auth.existingSecret | default (include "stocks-alert.cosmosSecretName" .) }}
                      key: {{ .Values.cosmos.auth.connectionStringKey }}
                - name: FASTAPI_MAILER_URL
                  value: {{ .Values.mailer.url | quote }}
                - name: EMAIL_RECIPIENT
                  value: {{ .Values.mailer.recipient | quote }}
                {{- with .Values.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
          volumes:
            - name: tmp
              emptyDir: {}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
