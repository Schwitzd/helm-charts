{{- include "stocks-alert.validate" . -}}
{{- if and (not .Values.cosmos.auth.existingSecret) .Values.cosmos.auth.connectionString -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stocks-alert.cosmosSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stocks-alert.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.cosmos.auth.connectionStringKey }}: {{ .Values.cosmos.auth.connectionString | b64enc }}
{{- end }}
